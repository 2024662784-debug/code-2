
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Model Viewer</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      padding: 10px 12px;
      color: white;
      background: #222;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Memuatkan model 3D...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="15000">
      <a-asset-item
        id="model3d"
        src="./model.glb">
      </a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.5"></a-entity>
    <a-entity
      light="type: directional; intensity: 1"
      position="1 3 2">
    </a-entity>

    <a-marker preset="hiro">
      <a-entity
        id="arModel"
        gltf-model="#model3d"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const model = document.getElementById("arModel");

    model.addEventListener("model-loaded", function () {
      status.textContent = "Model berjaya dimuatkan. Imbas marker Hiro.";
    });

    model.addEventListener("model-error", function (event) {
      status.textContent = "Gagal memuatkan model GLB. Semak laluan fail.";
      console.error("Model error:", event.detail);
    });
  </script>
</body>
</html>
